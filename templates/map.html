<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Map</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        /* ================= MAP ROUTE ================= */

        .campus-map {
            position: relative;
            overflow: hidden;
        }

        .route-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .route-line {
            fill: none;
            stroke: #e53935;
            stroke-width: 7;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 14 10;

            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.25));

            animation: routeMove 0.8s linear infinite;
        }

        @keyframes routeMove {
            to {
                stroke-dashoffset: -24;
            }
        }

        .map-location {
            position: absolute;
            z-index: 4;
        }

        .selected-location {
            border-color: #e53935 !important;
            box-shadow:
                0 0 0 4px rgba(229,57,53,0.15),
                0 8px 20px rgba(0,0,0,0.18);
        }

        .map-navigation,
        .map-actions {
            position: relative;
            z-index: 5;
        }
    </style>
</head>


<body>

<section class="map-page">

    <!-- ================= HEADING ================= -->

    <div class="map-heading">

        <span class="map-badge">
            📍 CAMPUS NAVIGATION
        </span>

        <h1>Campus Map</h1>

        <p>
            Find departments, labs, classrooms and important
            facilities on campus.
        </p>

    </div>


    <!-- ================= CAMPUS MAP ================= -->

    <div class="campus-map" id="campusMap">

        <!-- ================= RED ROUTE ================= -->

        <svg
            id="routeSvg"
            class="route-svg"
            viewBox="0 0 1280 853"
            preserveAspectRatio="none">

            <path
                id="routePath"
                class="route-line"
                d="">
            </path>

        </svg>


        <!-- ================= LOCATIONS ================= -->

        <!-- CSE -->
        <button
            class="map-location cse"
            data-location="cse">

            💻

            <span>CSE Department</span>
            <small>Computer Science</small>

        </button>


        <!-- ECE -->
        <button
            class="map-location ece"
            data-location="ece">

            ⚡

            <span>ECE Department</span>
            <small>Electronics</small>

        </button>


        <!-- LIBRARY -->
        <button
            class="map-location library"
            data-location="library">

            📚

            <span>Library</span>
            <small>Study Area</small>

        </button>


        <!-- MECHANICAL -->
        <button
            class="map-location mechanical"
            data-location="mechanical">

            ⚙️

            <span>Mechanical</span>
            <small>Mechanical Department</small>

        </button>


        <!-- CANTEEN -->
        <button
            class="map-location canteen"
            data-location="canteen">

            🍴

            <span>Canteen</span>
            <small>Food Area</small>

        </button>


        <!-- CIVIL -->
        <button
            class="map-location civil"
            data-location="civil">

            🏛️

            <span>Civil Department</span>
            <small>Civil Engineering</small>

        </button>


        <!-- MAIN CAMPUS -->
        <button
            class="map-location maincampus"
            data-location="maincampus">

            🏫

            <span>Main Campus</span>
            <small>College Building</small>

        </button>


        <!-- WASHROOMS -->
        <button
            class="map-location washrooms"
            data-location="washrooms">

            🚻

            <span>Washrooms</span>
            <small>Campus Facilities</small>

        </button>


        <!-- MEDICAL -->
        <button
            class="map-location medical"
            data-location="medical">

            🏥

            <span>Medical Room</span>
            <small>First Aid</small>

        </button>


        <!-- SECURITY -->
        <button
            class="map-location security"
            data-location="security">

            🛡️

            <span>Security</span>
            <small>Security Office</small>

        </button>


        <!-- MAIN GATE -->
        <button
            class="map-location gate"
            data-location="gate">

            🚪

            <span>Main Gate</span>
            <small>Campus Entrance</small>

        </button>


        <!-- EMERGENCY EXIT -->
        <button
            class="map-location emergency"
            data-location="emergency">

            🚨

            <span>Emergency Exit</span>
            <small>Emergency Route</small>

        </button>

    </div>


    <!-- ================= DESTINATION ================= -->

    <div class="map-navigation">

        <h2>📍 Select Destination</h2>

        <div class="navigation-controls">

            <select id="destination">

                <option value="">
                    Select a location
                </option>

                <option value="cse">
                    CSE Department
                </option>

                <option value="ece">
                    ECE Department
                </option>

                <option value="library">
                    Library
                </option>

                <option value="mechanical">
                    Mechanical Department
                </option>

                <option value="canteen">
                    Canteen
                </option>

                <option value="civil">
                    Civil Department
                </option>

                <option value="maincampus">
                    Main Campus
                </option>

                <option value="washrooms">
                    Washrooms
                </option>

                <option value="medical">
                    Medical Room
                </option>

                <option value="security">
                    Security
                </option>

                <option value="emergency">
                    Emergency Exit
                </option>

            </select>


            <button
                type="button"
                class="map-primary-btn"
                onclick="startNavigation()">

                📍 Start Navigation

            </button>

        </div>


        <!-- ================= ROUTE RESULT ================= -->

        <div
            id="routeResult"
            class="route-result"
            style="display:none;">

            <h3>✅ Route Found!</h3>

            <p id="routeText"></p>

        </div>

    </div>


    <!-- ================= BACK BUTTON ================= -->

    <div class="map-actions">

        <a
            href="{{ url_for('dashboard') }}"
            class="map-secondary-btn">

            ← Back to Dashboard

        </a>

    </div>

</section>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

/* =====================================================
   LOCATION NAMES
===================================================== */

const locationNames = {

    cse: "CSE Department",

    ece: "ECE Department",

    library: "Library",

    mechanical: "Mechanical Department",

    canteen: "Canteen",

    civil: "Civil Department",

    maincampus: "Main Campus",

    washrooms: "Washrooms",

    medical: "Medical Room",

    security: "Security",

    emergency: "Emergency Exit"

};


/* =====================================================
   ROAD ROUTES
   STARTING POINT = MAIN GATE

   Coordinates are placed on the road paths.
===================================================== */

const routes = {

    /* =========================
       MAIN GATE → CSE

       Main Gate
       ↓
       Left-side road
       ↓
       Road between CSE & Mechanical
       →
       CSE
    ========================= */

    cse:
        "M 95 735 " +
        "L 95 555 " +
        "L 95 350 " +
        "L 95 245 " +
        "L 300 245 " +
        "L 300 205",


    /* =========================
       MAIN GATE → MECHANICAL
    ========================= */

    mechanical:
        "M 95 735 " +
        "L 95 555 " +
        "L 95 425 " +
        "L 300 425 " +
        "L 300 390",


    /* =========================
       MAIN GATE → ECE

       Bottom road
       →
       Central road
       ↑
       ECE
    ========================= */

    ece:
        "M 95 735 " +
        "L 95 785 " +
        "L 640 785 " +
        "L 640 455 " +
        "L 640 245 " +
        "L 720 245 " +
        "L 720 205",


    /* =========================
       MAIN GATE → LIBRARY
    ========================= */

    library:
        "M 95 735 " +
        "L 95 785 " +
        "L 1040 785 " +
        "L 1040 455 " +
        "L 1040 245 " +
        "L 1090 245 " +
        "L 1090 205",


    /* =========================
       MAIN GATE → CANTEEN
    ========================= */

    canteen:
        "M 95 735 " +
        "L 95 785 " +
        "L 640 785 " +
        "L 640 455 " +
        "L 720 455 " +
        "L 720 390",


    /* =========================
       MAIN GATE → CIVIL
    ========================= */

    civil:
        "M 95 735 " +
        "L 95 785 " +
        "L 1040 785 " +
        "L 1040 455 " +
        "L 1090 455 " +
        "L 1090 390",


    /* =========================
       MAIN GATE → MAIN CAMPUS
    ========================= */

    maincampus:
        "M 95 735 " +
        "L 95 785 " +
        "L 640 785 " +
        "L 640 650 " +
        "L 720 650",


    /* =========================
       MAIN GATE → SECURITY
    ========================= */

    security:
        "M 95 735 " +
        "L 95 785 " +
        "L 400 785 " +
        "L 400 650",


    /* =========================
       MAIN GATE → WASHROOMS
    ========================= */

    washrooms:
        "M 95 735 " +
        "L 95 785 " +
        "L 1040 785 " +
        "L 1040 570 " +
        "L 1090 570 " +
        "L 1090 520",


    /* =========================
       MAIN GATE → MEDICAL
    ========================= */

    medical:
        "M 95 735 " +
        "L 95 785 " +
        "L 1110 785 " +
        "L 1110 650",


    /* =========================
       MAIN GATE → EMERGENCY EXIT
    ========================= */

    emergency:
        "M 95 735 " +
        "L 95 785 " +
        "L 1210 785 " +
        "L 1210 120 " +
        "L 1180 120"

};


/* =====================================================
   START NAVIGATION
===================================================== */

function startNavigation() {

    const destination =
        document.getElementById("destination").value;

    const routePath =
        document.getElementById("routePath");

    const routeResult =
        document.getElementById("routeResult");

    const routeText =
        document.getElementById("routeText");


    /* No destination selected */

    if (destination === "") {

        alert("Please select a destination.");

        routePath.setAttribute("d", "");

        routeResult.style.display = "none";

        document
            .querySelectorAll(".map-location")
            .forEach(function(location) {

                location.classList.remove(
                    "selected-location"
                );

            });

        return;
    }


    /* Get selected route */

    const route = routes[destination];


    if (!route) {

        alert("Route not available.");

        return;
    }


    /* Draw red route */

    routePath.setAttribute("d", route);


    /* Show route result */

    routeResult.style.display = "block";


    routeText.innerHTML =
        "Route from <strong>Main Gate</strong> to <strong>" +
        locationNames[destination] +
        "</strong> is displayed on the map.";


    /* Remove previous highlight */

    document
        .querySelectorAll(".map-location")
        .forEach(function(location) {

            location.classList.remove(
                "selected-location"
            );

        });


    /* Highlight destination */

    const selectedLocation =
        document.querySelector(
            '[data-location="' +
            destination +
            '"]'
        );


    if (selectedLocation) {

        selectedLocation.classList.add(
            "selected-location"
        );

    }

}


/* =====================================================
   CLICK LOCATION DIRECTLY
===================================================== */

document
    .querySelectorAll(".map-location")
    .forEach(function(location) {

        location.addEventListener(
            "click",
            function() {

                const destination =
                    this.getAttribute(
                        "data-location"
                    );


                /* Main Gate does not need navigation */

                if (destination === "gate") {

                    return;

                }


                /* Set dropdown */

                document.getElementById(
                    "destination"
                ).value = destination;


                /* Start route */

                startNavigation();

            }
        );

    });


/* =====================================================
   CLEAR ROUTE WHEN DROPDOWN CHANGES
===================================================== */

document
    .getElementById("destination")
    .addEventListener(
        "change",
        function() {

            if (this.value === "") {

                document
                    .getElementById("routePath")
                    .setAttribute("d", "");


                document
                    .getElementById("routeResult")
                    .style.display = "none";


                document
                    .querySelectorAll(".map-location")
                    .forEach(function(location) {

                        location.classList.remove(
                            "selected-location"
                        );

                    });

            }

        }
    );

</script>

</body>
</html>
